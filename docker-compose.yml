services:
  db:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ★追加：wp-content/uploads の作成＆権限調整（毎回自動で治す）
  wp_fix_permissions:
    image: wordpress:6.4-php8.2-apache
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wp_html:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./static:/var/www/html/static
      - ./static-src:/var/www/html/static-src
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      set -eu;
      echo "[wp_fix_permissions] start";
      mkdir -p /var/www/html/wp-content/uploads;
      chown -R 33:33 /var/www/html/wp-content;
      chmod -R 775 /var/www/html/wp-content/uploads;
      echo "[wp_fix_permissions] done";
    restart: "no"

  wordpress:
    image: wordpress:6.4-php8.2-apache
    restart: always
    depends_on:
      db:
        condition: service_healthy
      wp_fix_permissions:
        condition: service_completed_successfully
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - wp_html:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./static:/var/www/html/static
      - ./static-src:/var/www/html/static-src
    working_dir: /var/www/html
    user: "33:33"

  static_builder:
    build:
      context: .
      dockerfile: docker/static-builder/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      wp_fix_permissions:
        condition: service_completed_successfully
      wordpress:
        condition: service_started
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      BUILD_INTERVAL_SECONDS: "${BUILD_INTERVAL_SECONDS:-30}"
      TOMATO_STATIC_S3_TARGET: "${TOMATO_STATIC_S3_TARGET:-s3://tomatonews-static-stg}"
    volumes:
      - wp_html:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./static:/var/www/html/static
      - ./static-src:/var/www/html/static-src
    working_dir: /var/www/html
    user: "33:33"
    command: >
      sh -lc '
      set -eu;
      echo "[static_builder] start. interval=${BUILD_INTERVAL_SECONDS}s";
      until wp core is-installed --path=/var/www/html >/dev/null 2>&1; do
        echo "[static_builder] waiting wordpress...";
        sleep 3;
      done;
      echo "[static_builder] wordpress ready. start loop.";
      while true; do
        echo "[static_builder] build start: $(date)";
        wp static-build --all --path=/var/www/html || true;
        echo "[static_builder] build end: $(date). sleep ${BUILD_INTERVAL_SECONDS}s";
        sleep "${BUILD_INTERVAL_SECONDS}";
      done
      '

volumes:
  db_data:
  wp_html:
