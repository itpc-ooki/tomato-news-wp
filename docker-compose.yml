services:
  db:
    image: ${DB_IMAGE:-mysql:8.0}
    container_name: wp-cms-db-1
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - wp-cms_default

  wordpress:
    image: wordpress:php8.2-apache
    container_name: wp-cms-wordpress-1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: "${MYSQL_DATABASE}"
      WORDPRESS_DB_USER: "${MYSQL_USER}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - wp_html:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./static-src:/var/www/html/static-src
      - ./static:/var/www/html/static
    networks:
      - wp-cms_default

  wp_fix_permissions:
    image: wordpress:php8.2-apache
    container_name: wp-cms-wp_fix_permissions-1
    depends_on:
      wordpress:
        condition: service_started
    command: >-
      bash -lc 'chown -R www-data:www-data /var/www/html/wp-content /var/www/html/static-src /var/www/html/static
      && chmod -R 775 /var/www/html/wp-content /var/www/html/static-src /var/www/html/static
      && echo "[wp_fix_permissions] done."'
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./static-src:/var/www/html/static-src
      - ./static:/var/www/html/static
    networks:
      - wp-cms_default
    restart: "no"

  static_builder:
    build:
      context: .
      dockerfile: docker/static-builder/Dockerfile
    container_name: wp-cms-static_builder-1
    depends_on:
      wordpress:
        condition: service_started
      wp_fix_permissions:
        condition: service_completed_successfully
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: "${MYSQL_DATABASE}"
      WORDPRESS_DB_USER: "${MYSQL_USER}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD}"
      AWS_REGION: "${AWS_REGION}"
      S3_BUCKET: "${S3_BUCKET}"
      S3_PREFIX: "${S3_PREFIX:-}"
      BUILD_INTERVAL_SECONDS: "${BUILD_INTERVAL_SECONDS:-30}"
      # Allow override per environment (.env.local / .env.stg)
      TOMATO_STATIC_S3_TARGET: "${TOMATO_STATIC_S3_TARGET:-s3://${S3_BUCKET}/static}"
      ENABLE_S3_SYNC: "${ENABLE_S3_SYNC:-0}"
      ENABLE_CLOUDFRONT_INVALIDATION: "${ENABLE_CLOUDFRONT_INVALIDATION:-0}"
      CLOUDFRONT_DISTRIBUTION_ID: "${CLOUDFRONT_DISTRIBUTION_ID:-}"
      CLOUDFRONT_INVALIDATION_PATHS: "${CLOUDFRONT_INVALIDATION_PATHS:-/static/*}"
    volumes:
      - wp_html:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./static-src:/var/www/html/static-src
      - ./static:/var/www/html/static
    networks:
      - wp-cms_default
    command: >
      sh -lc '
      set -eu;

      echo "[static_builder] start. interval=${BUILD_INTERVAL_SECONDS:-30}s";
      until wp core is-installed --path=/var/www/html >/dev/null 2>&1; do
        echo "[static_builder] waiting wordpress...";
        sleep 3;
      done;

      echo "[static_builder] wordpress ready.";
      while true; do
        echo "[static_builder] build start: $(date -u +%F\ %T) UTC";
        wp --allow-root tomato auto-static-run-now --debug || true;

        # NOTE: S3 sync + CloudFront invalidation are handled inside the WP-CLI runner.

        echo "[static_builder] cycle done. sleep ${BUILD_INTERVAL_SECONDS:-30}s";
        sleep "${BUILD_INTERVAL_SECONDS:-30}";
      done
      '

networks:
  wp-cms_default:

volumes:
  db_data:
  wp_html:
