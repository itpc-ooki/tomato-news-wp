<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>ログイン｜トマト新聞 デジタル版</title>

  <!-- Same CSS as index.html -->
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/common/css/styles.css">
</head>
<body class="page-login">

  <div id="header-container"></div>

  <!-- キーワードスライダー（SPのみ表示） -->
  <div class="kw-bar" role="navigation" aria-label="キーワード">
    <div class="kw-inner">
      <div class="kw-track">
        <span class="kw-pill">夏秋トマト</span>
        <span class="kw-pill">冬春トマト</span>
        <span class="kw-pill">品種リスト</span>
        <span class="kw-pill">栽培面積</span>
        <span class="kw-pill">収量データ</span>
        <span class="kw-pill">病害虫</span>
        <span class="kw-pill">市況</span>
        <span class="kw-pill">WEBセミナー</span>
        <span class="kw-pill">夏秋トマト</span>
        <span class="kw-pill">冬春トマト</span>
        <span class="kw-pill">品種リスト</span>
        <span class="kw-pill">栽培面積</span>
        <span class="kw-pill">収量データ</span>
        <span class="kw-pill">病害虫</span>
        <span class="kw-pill">市況</span>
        <span class="kw-pill">WEBセミナー</span>
      </div>
    </div>
  </div>

  <!-- メインコンテンツ -->
  <div class="main">
    <div class="login-container">
      <div class="login-header">
        <h1 class="login-title">ログイン</h1>
        <p class="login-subtitle">トマト新聞デジタル版にログイン</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">メールアドレス</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="example@email.com"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="パスワードを入力"
            required
          />
        </div>

        <div class="form-checkbox">
          <input type="checkbox" id="remember" />
          <label for="remember">ログイン状態を保持する</label>
        </div>

        <div class="form-link">
          <a href="#" id="forgotPasswordLink">パスワードをお忘れの方</a>
        </div>

        <button type="submit" class="login-btn">ログイン</button>
      </form>

      <div class="divider">
        <span>または</span>
      </div>

      <div class="signup-link">
        アカウントをお持ちでない方は<br>
        <a href="./register.html" id="registerLink">新規会員登録（無料）</a>
      </div>
    </div>
  </div>

  <!-- Footer will be loaded here by JavaScript -->
  <div id="footer-container"></div>

  <!-- Same scripts as index.html -->
  <script src="/static/auth.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/common/js/components.js"></script>
</body>
</html>
