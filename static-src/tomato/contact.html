<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>お問い合わせ | トマト新聞</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="page-contact">
  <!-- Common Header -->
  <div id="header-container"></div>

  <main>
    <div class="page-hero">
      <div class="page-hero-inner">
        <div class="breadcrumb">
          <a href="./index.html">ホーム</a>
          <span class="breadcrumb-separator">›</span>
          <span class="breadcrumb-current">お問い合わせ</span>
        </div>
        <h1>お問い合わせ</h1>
        <p class="page-contact-subtitle">ご質問・ご意見・ご要望がございましたら、下記フォームよりお気軽にお問い合わせください。</p>
      </div>
    </div>

    <div class="page-content">
      <div class="contact-grid">
        <div class="contact-form-wrap">
          <div class="form-success" id="formSuccess" hidden>
            <h3>✓ 送信が完了しました</h3>
            <p>お問い合わせいただきありがとうございます。<br>内容を確認の上、担当者よりご連絡いたします。<br>通常3営業日以内にご返信いたします。</p>
          </div>

          <form id="contactForm">
            <div class="form-group">
              <label for="contact-category">お問い合わせ種別<span class="required">必須</span></label>
              <select class="form-control" id="contact-category" name="category" required>
                <option value="">選択してください</option>
                <option value="membership">会員登録・ログインについて</option>
                <option value="content">コンテンツ・記事について</option>
                <option value="seminar">WEBセミナーについて</option>
                <option value="advertisement">広告掲載について</option>
                <option value="other">その他</option>
              </select>
            </div>

            <div class="form-group">
              <label for="contact-name">お名前<span class="required">必須</span></label>
              <input type="text" class="form-control" id="contact-name" name="name" placeholder="例：田中 太郎" required />
            </div>

            <div class="form-group">
              <label for="contact-organization">所属（会社・JA名など）<span class="optional">任意</span></label>
              <input type="text" class="form-control" id="contact-organization" name="organization" placeholder="例：○○農業協同組合" />
            </div>

            <div class="form-group">
              <label for="contact-email">メールアドレス<span class="required">必須</span></label>
              <input type="email" class="form-control" id="contact-email" name="email" placeholder="例：example@mail.com" required />
              <div class="form-note">ご返信先のメールアドレスをご入力ください。</div>
            </div>

            <div class="form-group">
              <label for="contact-tel">電話番号<span class="optional">任意</span></label>
              <input type="tel" class="form-control" id="contact-tel" name="tel" placeholder="例：03-0000-0000" />
            </div>

            <div class="form-group">
              <label for="contact-message">お問い合わせ内容<span class="required">必須</span></label>
              <textarea class="form-control" id="contact-message" name="message" placeholder="お問い合わせ内容をご記入ください。" required></textarea>
            </div>

            <div class="form-group form-agreement">
              <label>
                <input type="checkbox" name="agreement" required />
                <span>
                  <a href="./privacy-policy.html" target="_blank" rel="noopener noreferrer">プライバシーポリシー</a>
                  および
                  <a href="./terms.html" target="_blank" rel="noopener noreferrer">利用規約</a>
                  に同意する
                </span>
              </label>
            </div>

            <button type="submit" class="form-submit">送信する</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Common Footer -->
  <div id="footer-container"></div>

  <!-- 全paper共通 -->
  <script src="../auth.js"></script>
  <script src="../app.js"></script>
</body>
</html>
